<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testAPI()">Test API Call</button>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                console.log('Making request to: http://localhost:8001/meetings/upcoming');
                const response = await fetch('http://localhost:8001/meetings/upcoming');
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Data received:', data);
                    result.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    const errorText = await response.text();
                    console.error('Error:', response.status, errorText);
                    result.innerHTML = 'Error: ' + response.status + ' - ' + errorText;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                result.innerHTML = 'Fetch error: ' + error.message;
            }
        }
    </script>
</body>
</html>
